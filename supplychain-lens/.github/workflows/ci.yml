name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # CPU-only PyTorch (~200 MB) instead of the default Linux build with CUDA (~4 GB). ADR-0009.
      - name: Install PyTorch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Hardware smoke test (quick)
        run: python scripts/smoke_test.py --quick --out reports/ci_hardware_profile.json

  # The hosted dashboard installs only requirements.txt (no PyTorch). Prove that works.
  inference-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install inference dependencies only
        run: python -m pip install -r requirements.txt pytest
      - name: Check PyTorch is absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"
      - name: App and core tests (no PyTorch)
        run: pytest -m "not torch"
